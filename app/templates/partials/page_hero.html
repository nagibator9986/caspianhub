{# Шапка внутренних страниц раздела «Сообщество». #}
{% macro page_hero(title, lead, icon, crumbs=[], badge=none) %}
<section class="relative overflow-hidden grain">
  <div class="aurora"><span></span><span></span><span></span></div>
  <div class="absolute inset-0 grid-bg opacity-50 pointer-events-none"></div>
  <div class="container-hub relative z-10 pt-8 pb-10 lg:pb-14">
    <nav class="flex items-center gap-2 text-xs mb-8 flex-wrap" aria-label="Хлебные крошки">
      <a href="{{ url_for('public.index') }}" class="ink-muted hover:text-[var(--brand)] transition-colors">{{ t('nav.home') }}</a>
      {% for label, href in crumbs %}
        <i data-lucide="chevron-right" class="w-3 h-3" style="color:var(--ink-4)"></i>
        <a href="{{ href }}" class="ink-muted hover:text-[var(--brand)] transition-colors">{{ label }}</a>
      {% endfor %}
      <i data-lucide="chevron-right" class="w-3 h-3" style="color:var(--ink-4)"></i>
      <span class="font-semibold" aria-current="page">{{ title }}</span>
    </nav>
    <div class="flex flex-col sm:flex-row sm:items-start gap-5">
      <span class="svc-icon !w-[4.5rem] !h-[4.5rem] !rounded-2xl flex-none" aria-hidden="true"><i data-lucide="{{ icon }}" class="w-8 h-8"></i></span>
      <div class="min-w-0 max-w-3xl">
        <h1 class="font-display text-3xl sm:text-4xl xl:text-[2.85rem] font-extrabold leading-[1.1]">{{ title }}</h1>
        <p class="mt-4 text-lg ink-muted leading-relaxed">{{ lead }}</p>
      </div>
    </div>
  </div>
</section>
{% endmacro %}
